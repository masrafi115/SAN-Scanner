name: Burp Extension

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      run-fatjar:
        description: "Build and upload the BApp JAR"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Validate and build
        run: ./gradlew build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: burp-extension
          path: build/libs/*.jar
          if-no-files-found: error

  fatjar:
    name: Build BApp JAR
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run-fatjar }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build JAR
        run: gradle build

      - name: Upload fat JAR
        uses: actions/upload-artifact@v4
        with:
          name: burp-bapp-extension
          path: build/libs/*all*.jar
          if-no-files-found: error
